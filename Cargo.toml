[package]
name = "stock_mm"
version = "0.1.0"
edition = "2024"
description = "Binance-referenced, Gate-executed market maker for SNDK perpetuals"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rust_decimal = { version = "1.37", features = ["serde", "serde-with-str"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[profile.release]
opt-level = 3
debug = 1
